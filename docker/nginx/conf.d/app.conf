server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Override http-level keepalive_timeout for this server
    keepalive_timeout 30s;

    # ── Upload size limit ─────────────────────────────────────────────────────
    client_max_body_size 20M;

    # ── Security headers ──────────────────────────────────────────────────────
    # Clickjacking protection
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    # Stops browser MIME-sniffing (prevents content-type confusion attacks)
    add_header X-Content-Type-Options    "nosniff"              always;
    # XSS auditor (legacy browsers)
    add_header X-XSS-Protection          "1; mode=block"        always;
    # Controls referrer information sent to other sites
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Restricts browser feature access (camera, mic, geolocation, etc.)
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content-Security-Policy — tightens allowed sources
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; style-src-elem 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # Uncomment when HTTPS is enabled:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Block access to hidden files & directories (.env, .git, .htaccess …) ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ── Block direct PHP execution in storage/ — CRITICAL ─────────────────────
    # Prevents an attacker from uploading a PHP webshell and executing it.
    # All PHP files under /storage must NEVER be executed by PHP-FPM.
    location ~* ^/storage/.*\.php$ {
        deny all;
        return 403;
    }

    # ── Block execution of other dangerous extensions in storage/ ─────────────
    # .phtml .php3 .php4 .php5 .phar are all PHP-executable
    location ~* ^/storage/.*\.(phtml|php3|php4|php5|phar|shtml|cgi|pl|py|rb|sh|bash|exe|bat|cmd|msi|vbs|ps1)$ {
        deny all;
        return 403;
    }

    # ── Static user-uploaded files ────────────────────────────────────────────
    # Served from the Docker storage volume mount (avoids symlink cross-mount issues)
    location /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        # Disable PHP for safety (belt-and-suspenders alongside the deny blocks above)
        location ~* \.php$ { deny all; return 403; }
    }

    # ── Versioned compiled frontend assets (long-lived cache) ─────────────────
    location ~* ^/build/assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Rate-limit authentication & password-reset routes ─────────────────────
    location ~* ^/(login|register|forgot-password|reset-password|api/auth) {
        limit_req zone=auth burst=5 nodelay;
        limit_req_log_level warn;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        # Disallow accessing PHP files that don't exist — prevents Nginx
        # from forwarding crafted PATH_INFO attacks to PHP-FPM
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP       $remote_addr;
        fastcgi_read_timeout 60;
        fastcgi_connect_timeout 10;
        fastcgi_send_timeout 60;

        fastcgi_buffer_size      32k;
        fastcgi_buffers          16 32k;
        fastcgi_busy_buffers_size 64k;

        fastcgi_hide_header X-Powered-By;
    }

    # ── Default ───────────────────────────────────────────────────────────────
    location / {
        # Apply global rate limit
        limit_req zone=global burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # ── Deny access to sensitive files that might end up in public/ ───────────
    location ~* \.(env|log|sql|bak|backup|conf|config|ini|sh|bash|key|pem|cer|crt|p12|pfx)$ {
        deny all;
        return 404;
    }
}
