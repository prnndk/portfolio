# ─────────────────────────────────────────────────────────────────────────────
# HTTP-context security & hardening directives
# Loaded before app.conf (lexical order: 00 < app)
# ─────────────────────────────────────────────────────────────────────────────

# ── Hide nginx version from headers and error pages ──────────────────────────
server_tokens off;

# ── Rate-limiting zones (defined here, applied per-location in app.conf) ──────
# Auth endpoints — 10 req/min per IP (burst of 5)
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# General API — 60 req/min per IP (burst of 20)
limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
# Global fallback — 300 req/min per IP
limit_req_zone $binary_remote_addr zone=global:20m rate=300r/m;

# Log 429 responses (do NOT suppress — helps detect attacks)
limit_req_status 429;

# ── Connection limiting ───────────────────────────────────────────────────────
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn conn_per_ip 50;

# ── Gzip (only safe types — never compress already-compressed or binary) ──────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_buffers 16 8k;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

# ── Timeouts (limit slow-loris and idle connections) ─────────────────────────
# keepalive_timeout is intentionally omitted here — the nginx base image sets
# it in nginx.conf (same http{} context), so repeating it causes a duplicate
# directive error. Override it per-server in app.conf if needed.
client_body_timeout  12s;
client_header_timeout 12s;
send_timeout         10s;

# ── Buffer sizes (mitigate buffer overflow / header injection attacks) ────────
client_body_buffer_size    16k;
client_header_buffer_size   2k;
large_client_header_buffers 4 8k;
