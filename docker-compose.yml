version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portofolio-app
    container_name: portofolio-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - portofolio-network

  db:
    image: mysql:8.0
    container_name: portofolio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    ports:
      - "127.0.0.1:3378:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - portofolio-network

  nginx:
    image: nginx:alpine
    container_name: portofolio-nginx
    restart: unless-stopped
    ports:
      - "8878:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - portofolio-network

networks:
  portofolio-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
